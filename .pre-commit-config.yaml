repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # dış kod (engine/third_party) bayt bayt kaynaktaki gibi kalır
      - id: trailing-whitespace
        exclude: ^engine/third_party/
      - id: end-of-file-fixer
        exclude: ^engine/third_party/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # sadece python/ — ruff 0.16 Markdown kod bloklarını da biçimlendiriyor, docs'a dokunmasın
      - id: ruff-check
        args: ["--fix"]
        files: ^python/
      - id: ruff-format
        files: ^python/
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      # CI ile aynı sürüm (ci.yml engine işi); yalnız motor kaynakları
      - id: clang-format
        files: ^engine/
        exclude: ^engine/third_party/  # dış kod değiştirilmeden kalır
        types_or: [c++]
