repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # sadece python/ — ruff 0.16 Markdown kod bloklarını da biçimlendiriyor, docs'a dokunmasın
      - id: ruff-check
        args: ["--fix"]
        files: ^python/
      - id: ruff-format
        files: ^python/
