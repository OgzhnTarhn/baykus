experiment: e2_ir
mode: ir
model: yolo26s.pt
data: data/dv_rgbt/data_ir.yaml
label_set: ir
train:
  imgsz: 640
  epochs: 50
  patience: 20
  batch: 16
  seed: 42
  close_mosaic: 10
eval:
  splits: [val]
  label_sets: [ir, rgb]
  slices: [illumination, size, class]
  n_boot: 1000
tracking:
  mlflow_experiment: baykus
