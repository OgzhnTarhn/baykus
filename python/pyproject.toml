[project]
name = "baykus"
version = "0.1.0"
description = "RGB-Thermal aerial vehicle detection on the edge"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"  # Colab T4 oturumu Python 3.13 (Spike C)
dependencies = [
  "numpy>=1.26",
  "opencv-python==5.0.0.93",  # C++ motoru 5.0.0 kaynaktan (Faz 3 eşlik)
  "tifffile>=2024.1.30",
  "pycocotools>=2.0.8",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "ensemble-boxes==1.0.9",
  "onnx>=1.23.1",
  "onnxruntime==1.30.0",  # C++ motoru aynı sürümün hazır paketi
  "trackers==2.6.1",  # ByteTrack referansı; C++ bu sürümü izler (tasarım §4.3)
  "py-cpuinfo>=9.0.0",
  "psutil>=7.2.2",
]

[project.optional-dependencies]
spike = ["ultralytics==8.4.177", "onnx>=1.16", "onnxruntime>=1.18"]
# Ultralytics sabit: deneyler arası sürüm farkı sonucu etkilemesin (E1 sonu, E2 ölçümü: 8.4.177)
train = [
    "ultralytics==8.4.177",
    "mlflow>=2.14",
    "onnxslim>=0.1.82",
]

[project.scripts]
baykus-data = "baykus.data.cli:main"
baykus-train = "baykus.train.cli:main"
baykus-eval = "baykus.eval.cli:main"
baykus-report = "baykus.report.cli:main"
baykus-robust = "baykus.robustness.cli:main"
baykus-fusion = "baykus.fusion.cli:main"
baykus-edge = "baykus.edge.cli:main"
baykus-bench = "baykus.bench.cli:main"
baykus-health = "baykus.health.cli:main"
baykus-engine = "baykus.engine_ref.cli:main"
baykus-track = "baykus.track.cli:main"
baykus-system = "baykus.system.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baykus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: gerçek veri veya ağ gerektiren testler (CI'da çalışmaz)"]
