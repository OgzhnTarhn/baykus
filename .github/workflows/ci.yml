name: ci
on:
  push:
    branches: [main, "f[0-9]*"]
  pull_request:

env:
  ORT_DISABLE_TELEMETRY: "1"  # ONNX Runtime telemetrisi (HTTPS gönderim denemesi) kapalı

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -m "not slow"

  # C++ motoru (Faz 3 Görev 17): biçim, derleme, kabul testleri (atlanamaz), sanitizer'lı tekrar.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror $(git ls-files 'engine/*.cpp' 'engine/*.hpp' ':!engine/third_party')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/engine.Dockerfile
          target: build
          load: true
          tags: baykus-engine-build
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max
      - name: models
        run: bash scripts/fetch_models.sh models
      # Kabul 1 a ham referansı bu makinede: ORT'nin işlemciye göre yuvarlama farkı bizim kodumuz değil
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: raw reference
        working-directory: python
        run: |
          uv sync --frozen
          uv run baykus-engine raw-ref --models ../models --manifest ../configs/engine/models.json \
            --out ../evidence/raw_ref.json
      - name: test
        run: RAW_REF=evidence/raw_ref.json EVIDENCE=evidence REQ=1 bash scripts/engine_test.sh
      - name: evidence
        run: |
          for app in "parity_report parity_detect" "parity_health parity_health"; do
            set -- $app
            docker run --rm -e BAYKUS_MODELS=/models -e BAYKUS_FIXTURES=/fixtures \
              -e BAYKUS_CONFIGS=/configs -e BAYKUS_RAW_REF=/out/raw_ref.json \
              -v "$PWD/models:/models:ro" \
              -v "$PWD/fixtures:/fixtures:ro" -v "$PWD/configs:/configs:ro" \
              -v "$PWD/evidence:/out" baykus-engine-build "/build/bin/baykus_$1" "/out/$2.json"
          done
          # Kabul 4: C++ izleri + Python karşılaştırıcısı (aynı tanım, baykus.track.parity)
          docker run --rm -v "$PWD/fixtures:/fixtures:ro" -v "$PWD/configs:/configs:ro" \
            -v "$PWD/evidence:/out" baykus-engine-build /build/bin/baykus_track \
            --dets /fixtures/tracks/dev_dets.json.gz --config /configs/engine/tracker.json \
            --out /out/dev_tracks_cpp.json.gz
          cd python && uv run baykus-track compare --py ../fixtures/tracks/dev_tracks_py.json.gz \
            --cpp ../evidence/dev_tracks_cpp.json.gz --out ../evidence/parity_track.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-evidence
          path: evidence/
          if-no-files-found: error
      - name: build (sanitize)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/engine.Dockerfile
          target: build
          load: true
          tags: baykus-engine-asan
          build-args: BAYKUS_SANITIZE=ON
          cache-from: |
            type=gha,scope=engine
            type=gha,scope=engine-asan
          cache-to: type=gha,scope=engine-asan,mode=max
      - name: test (sanitize)
        run: IMAGE=baykus-engine-asan RAW_REF=evidence/raw_ref.json REQ=1 bash scripts/engine_test.sh
